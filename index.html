<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- 1. 페이지 설명 (구글, 네이버 등 검색 결과에 노출되는 설명) -->
<meta name="description" content="크레스티드게코 사육에 필요한 핵심 정보를 확인하세요.">

<!-- 2. Open Graph 제목 (카카오톡, 페이스북 등에 링크 공유 시 나오는 제목) -->
<meta property="og:title" content="크레사육정보">

<!-- 3. Open Graph 설명 (카카오톡, 페이스북 등에 링크 공유 시 나오는 설명) -->
<meta property="og:description" content="크레스티드게코 사육에 필요한 핵심 정보를 확인하세요.">

<!-- (선택) Open Graph 기본 설정 - 함께 넣어두면 링크 공유 시 더 깔끔하게 노출됩니다 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://info.creq.kr">
<meta property="og:image" content="https://info.creq.kr/images/info/5.png">
<meta name="keywords" content="CREQ, creq, 크레큐, 크레Q, 크레브리더모임, 브리더모임, 크레경매, 크레스티드게코, 크레, 게코">
<title>크레사육정보</title>
<link rel="icon" href="./images/icon-192.png" type="image/png">
<meta name="theme-color" content="#ff7e36">
<style>
  :root{
    --bg:#f8fafc;
    --ink:#0f172a;
    --sub:#64748b;
    --accent:#ff7e36;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:36px 18px 48px;}

  /* 인트로 카드 */
  .intro{
    background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;
    padding:16px 18px;margin-bottom:22px;
  }
  .intro .t{font-weight:800;font-size:14px;margin-bottom:4px;}
  .intro .d{font-size:12.5px;color:#9a3412;line-height:1.6;margin-bottom:10px;}
  .intro .n{
    font-size:11px;color:var(--sub);background:#fff;display:inline-block;
    padding:6px 10px;border-radius:10px;border:1px solid var(--line);line-height:1.5;
  }

  /* 랜덤 히어로 이미지 */
  .hero-image{
    border-radius:16px;overflow:hidden;margin-bottom:24px;
    box-shadow:0 10px 24px rgba(0,0,0,.1);border:1px solid var(--line);
    background:#fff;
  }
  .hero-image img{width:100%;height:auto;display:block;}

  /* 경매장 배너 */
  .auction-banner{
    display:block;margin-bottom:14px;border-radius:14px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid var(--line);
  }
  .auction-banner img{width:100%;height:auto;display:block;}

  /* 가이드 섹션 (접기) */
  .guide-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;font-family:inherit;cursor:pointer;margin-bottom:14px;
  }
  .guide-toggle .l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
  .guide-toggle .chev{color:#cbd5e1;font-size:13px;transition:transform .2s;}
  .guide-section.open .guide-toggle .chev{transform:rotate(180deg);}
  .guide-section-body{display:none;}
  .guide-section.open .guide-section-body{display:block;}

  /* 가이드 아코디언 */
  .guide-list{display:flex;flex-direction:column;gap:10px;margin-bottom:36px;}
  .guide-item{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;
  }
  .guide-btn{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:none;border:none;text-align:left;
    font-family:inherit;cursor:pointer;
  }
  .guide-btn .emoji{
    width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#f1f5f9;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .guide-btn .title{flex:1;font-size:13.5px;font-weight:700;}
  .guide-btn .chev{color:#cbd5e1;font-size:13px;transition:transform .2s;flex-shrink:0;}
  .guide-item.open .guide-btn .title{color:var(--accent);}
  .guide-item.open .guide-btn .chev{transform:rotate(180deg);}
  .guide-body{
    display:none;padding:2px 18px 18px;font-size:12.5px;line-height:1.7;color:#475569;
    border-top:1px solid var(--line);background:#f8fafc;
  }
  .guide-item.open .guide-body{display:block;padding-top:14px;}
  .guide-body ul{margin:0;padding-left:18px;}
  .guide-body li{margin-bottom:8px;}
  .guide-body strong{color:var(--ink);}
  .guide-body .warn{color:#dc2626;font-weight:700;}
  .guide-body .box{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;
  }
  .guide-body .box h4{margin:0 0 6px;font-size:12.5px;font-weight:800;color:var(--ink);}

  /* 제품 랭킹 카드 */
  .prod{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-bottom:10px;}
  .prod:last-child{margin-bottom:0;}
  .prod img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f1f5f9;}
  .prod .rank{
    display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#94a3b8;
    padding:2px 7px;border-radius:20px;margin-bottom:4px;
  }
  .prod .rank.gold{background:var(--accent);}
  .prod .name{font-size:12.5px;font-weight:800;margin-bottom:2px;}
  .prod .feat{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;}
  .prod .desc{font-size:11px;color:#94a3b8;line-height:1.5;}

  /* 하단 협찬 링크 */
  .sponsor-row{display:flex;gap:10px;justify-content:center;}
  .sponsor{
    flex:0 1 140px;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 6px;text-decoration:none;color:inherit;
    font-family:inherit;cursor:pointer;text-align:center;
    transition:transform .15s ease;
  }
  .sponsor:active{transform:scale(.95);}
  .sponsor img{width:30px;height:30px;border-radius:8px;object-fit:cover;}
  .sponsor span{font-size:10.5px;font-weight:700;color:var(--sub);}

  footer{text-align:center;margin-top:32px;font-size:11px;color:#cbd5e1;}

  /* 스토어 준비중 오버레이 */
  #prep-overlay{
    position:fixed;inset:0;background:#000;z-index:9999;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  #prep-overlay img{
    max-width:320px;width:100%;border-radius:16px;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  #prep-overlay .msg{color:#fff;font-size:18px;font-weight:800;margin-top:22px;}
  #prep-overlay .sub{color:#cbd5e1;font-size:13.5px;margin-top:8px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero-image">
    <img id="hero-random-img" src="" alt="크레Q 이미지">
  </div>

  <div class="guide-section" id="guide-section">
    <button class="guide-toggle" type="button" id="guide-toggle">
      <span class="l">📚 크레스티드 게코 완벽 사육 가이드</span>
      <span class="chev">▾</span>
    </button>
    <div class="guide-section-body">
      <div class="intro">
        <div class="t">🦎 크레스티드 게코 백과사전에 오신 것을 환영합니다!</div>
        <div class="d">궁금한 주제를 눌러서 사육에 필요한 핵심 꿀팁과 추천 정보를 확인하세요. 크레Q가 건강한 브리딩을 응원합니다.</div>
        <div class="n">ℹ️ 본 가이드는 국내외 사육 정보를 바탕으로 정리한 참고 자료이며, 개체 상태에 따라 전문가(파충류 수의사)의 소견이 우선합니다.</div>
      </div>
      <div class="guide-list" id="guide-list"></div>
    </div>
  </div>

  <a class="auction-banner" href="https://auction.creq.kr">
    <img src="./images/main_banner.jpg" alt="크레Q 경매장">
  </a>
  <div class="sponsor-row">
    <button class="sponsor" id="btn-store" type="button">
      <img src="./images/smartstore_logo.png" alt="스마트스토어">
      <span>스마트스토어</span>
    </button>
    <a class="sponsor" href="https://open.kakao.com/o/gRTKjyJi" target="_blank" rel="noopener noreferrer">
      <img src="./images/kakao.png" alt="오픈톡">
      <span>오픈톡</span>
    </a>
  </div>

  <footer>함께 하기에 더욱 빛나는 도마뱀 생활 CREQ.kr</footer>
</div>

<div id="prep-overlay">
  <img src="./images/x.png" alt="오픈 준비중">
  <p class="msg">오픈 준비중입니다</p>
  <p class="sub" id="prep-countdown">5초 후 CREQ 사이트로 이동합니다</p>
</div>

<script>
  (function loadHeroImage() {
    var found = [];
    var n = 1;
    function tryNext() {
      var probe = new Image();
      probe.onload = function () {
        found.push('./images/info/' + n + '.png');
        n++;
        tryNext();
      };
      probe.onerror = function () {
        if (found.length) {
          document.getElementById('hero-random-img').src = found[Math.floor(Math.random() * found.length)];
        }
      };
      probe.src = './images/info/' + n + '.png';
    }
    tryNext();
  })();

  document.getElementById('btn-store').addEventListener('click', function () {
    var overlay = document.getElementById('prep-overlay');
    var countEl = document.getElementById('prep-countdown');
    overlay.style.display = 'flex';

    var sec = 5;
    var timer = setInterval(function () {
      sec -= 1;
      if (sec > 0) {
        countEl.textContent = sec + '초 후 경매장으로 이동합니다';
      } else {
        clearInterval(timer);
      }
    }, 1000);

    setTimeout(function () {
      window.location.href = 'https://creq.kr';
    }, 5000);
  });

  document.getElementById('guide-toggle').addEventListener('click', function () {
    document.getElementById('guide-section').classList.toggle('open');
  });

  var guides = [
    {
      emoji: '📖',
      title: '1. 크레스티드 게코 기본 정보',
      body: '<ul>'
        + '<li><strong>고향과 야생 환경:</strong> 뉴칼레도니아 섬의 숲속 나무 위에 서식하는 교목성(나무를 타는) 도마뱀입니다.</li>'
        + '<li><strong>수명 및 크기:</strong> 평균 10~15년(최장 20년) 이상 장수하며, 성체 기준 무게는 35g~50g 내외로 성장합니다.</li>'
        + '<li><strong>특징 (개구리 엉덩이):</strong> 위협을 느끼거나 큰 스트레스를 받으면 스스로 꼬리를 자릅니다(자절). 다른 도마뱀과 달리 한 번 잘린 꼬리는 다시 자라지 않으며, 꼬리가 없는 상태를 귀엽게 \'개구리 엉덩이(Frog butt)\'라고 부릅니다. 일상생활에는 전혀 지장이 없습니다.</li>'
        + '<li><strong>야행성:</strong> 주로 해 질 녘부터 새벽까지 활동하므로, 자외선(UVB) 조명이 필수는 아닙니다.</li>'
        + '</ul>'
    },
    {
      emoji: '🌡️',
      title: '2. 사육 환경 세팅 (온도/습도)',
      body: '<div class="box"><h4>🌡️ 온도 관리 (가장 중요)</h4><p>주간 22~26도, 야간 20~22도를 유지합니다. 28도 이상 올라가면 열사병으로 급사할 위험이 있으므로 여름철 쿨링 시스템은 필수입니다.</p></div>'
        + '<div class="box"><h4>💧 습도 및 환기</h4><p>60~80% 사이가 이상적이며, 하루 1~2회 사육장 벽면에 물을 분무해 주어 맺힌 물방울을 핥아먹게 유도합니다.</p><p class="warn">주의: 과습은 호흡기 질환이나 피부병을 유발하므로 습도를 높인 후 반드시 환기를 통해 건조해지는 사이클을 만들어 주어야 합니다.</p></div>'
        + '<div class="box"><h4>🌿 사육장 세팅</h4><ul>'
        + '<li><strong>구조:</strong> 나무 위에서 생활하는 교목성 도마뱀이므로, 세로로 높은 형태(Tall 타입)의 사육장이 적합합니다.</li>'
        + '<li><strong>구조물:</strong> 백업, 코르크 튜브, 유목, 인조 덩굴 등을 배치하여 편하게 매달리고 위아래로 점프할 수 있는 동선을 만들어 줍니다.</li>'
        + '<li><strong>바닥재:</strong> 위생적이고 관리하기 쉬운 키친타월이 가장 추천됩니다. 코코피트 등 흙 바닥재를 사용할 경우 사냥 중 흙을 삼켜 장막힘(임팩션)이 오지 않도록 밥그릇을 높은 곳에 배치하세요.</li>'
        + '</ul></div>'
    },
    {
      emoji: '🍽️',
      title: '3. 먹이(피딩)와 영양 관리',
      body: '<ul>'
        + '<li><strong>슈퍼푸드 (메인 식단):</strong> 야생에서는 과일의 즙과 곤충을 먹지만, 사육 시에는 완벽하게 배합한 전용 사료(슈퍼푸드)를 케첩 농도로 물에 개어 급여합니다.</li>'
        + '<li><strong>충식 (특식):</strong> 귀뚜라미나 밀웜을 일주일에 1~2회 주면 성장 속도가 눈에 띄게 빨라집니다. 벌레를 줄 때는 반드시 칼슘제를 묻혀서(더스팅) 급여해야 합니다.</li>'
        + '<li><strong>급여 주기:</strong><ul>'
        + '<li>베이비 (~10g): 매일 또는 이틀에 한 번</li>'
        + '<li>아/준성체 (10~25g): 이틀에 한 번</li>'
        + '<li>성체 (25g~): 일주일에 2~3회</li>'
        + '</ul></li>'
        + '<li><strong>자율 급여 vs 핸드 피딩:</strong> 밥그릇에 덜어두고 스스로 먹게 하는 \'자율 급여\'가 가장 스트레스가 적습니다. 잘 먹지 않는 아이들에 한해 주사기나 숟가락으로 코에 묻혀 \'핸드 피딩\'을 진행합니다.</li>'
        + '</ul>'
    },
    {
      emoji: '🏆',
      title: '4. 추천 슈퍼푸드 TOP 5',
      body: '<div class="prod"><img src="./images/pangea.jpg" alt="판게아 인섹트"><div><span class="rank gold">1위</span><div class="name">판게아 인섹트 (Pangea)</div><div class="feat">핵심: 곤충 단백질, 프리미엄 유청 단백, 과일 건조 분말</div><div class="desc">전 세계 브리더들이 인정하는 글로벌 스탠다드. 완벽한 칼슘과 인의 황금 비율로 대사성 골질환(MBD) 예방에 탁월하며 기호성이 매우 뛰어남.</div></div></div>'
        + '<div class="prod"><img src="./images/foodieworm.jpg" alt="푸디웜 게코푸디"><div><span class="rank">2위</span><div class="name">푸디웜 게코푸디 인섹트</div><div class="feat">핵심: 동애등에(BSFL) 추출 단백질</div><div class="desc">천연 칼슘 함량이 획기적으로 높은 동애등에 베이스. 인공 칼슘 과다 주입 없이 자연스럽고 풍부한 영양 공급이 가능해 성장기 개체에 최적화됨.</div></div></div>'
        + '<div class="prod"><img src="./images/vitalmeal.jpg" alt="바이탈밀 슈퍼그린"><div><span class="rank">3위</span><div class="name">바이탈밀 슈퍼그린</div><div class="feat">핵심: 고급 누에(Silkworm) 단백질, 천연 그린 허브</div><div class="desc">누에 단백질 특유의 우수한 필수 아미노산 조성을 갖춤. 지방 함량이 낮고 소화 흡수율이 높아 장 트러블 방지 및 비만 예방에 훌륭함.</div></div></div>'
        + '<div class="prod"><img src="./images/crepax.jpg" alt="크레팍스 올인원"><div><span class="rank">4위</span><div class="name">크레팍스 올인원</div><div class="feat">핵심: 곤충 단백질, 장 건강 특화 식이섬유</div><div class="desc">화학 보존제 제로. 비타민 D3와 식이섬유가 촘촘히 배합된 올인원 설계로, 단일 급여 시 흔히 오는 변비나 탈피 부전을 효과적으로 방어함.</div></div></div>'
        + '<div class="prod"><img src="./images/grep.jpg" alt="녹십자 지렙"><div><span class="rank">5위</span><div class="name">녹십자 지렙(G-REP) 시리즈</div><div class="feat">핵심: 수의학 기반 단백질, 천연 항산화 물질(용과 등)</div><div class="desc">동물 의약품 전문 기업의 HACCP 기준 제조로 중금속 및 세균 걱정이 없음. 천연 항산화제와 유익균이 포함되어 면역력 강화에 중점을 둠.</div></div></div>'
    },
    {
